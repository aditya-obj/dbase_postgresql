# File: analysis_options.yaml
# Purpose: Strict static analysis for dabase_postgresql.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # These two push the Dart 3.13 constructor syntax (`new(...)`, enum
    # constructors without `const`). Keeping the classic syntax lets the SDK
    # floor be lowered later without rewriting every constructor.
    unnecessary_type_name_in_constructor: false
    unnecessary_const_in_enum_constructor: false
    # Requires `@immutable` from package:meta, but v0.1 has zero runtime
    # dependencies. Every class overriding == is `final` with only final
    # fields; see doc/adr/0001-libpq-divergences.md.
    avoid_equals_and_hash_code_on_mutable_classes: false
