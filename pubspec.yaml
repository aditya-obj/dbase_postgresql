name: dbase_postgresql
description: >-
  Pure-Dart PostgreSQL toolkit: libpq connection string parsing, a SQL
  lexer, a psql-style statement splitter, and statement safety checks.
version: 0.1.0
publish_to: none
# TODO(owner): set once the repository URL is decided.
# repository: https://github.com/OWNER/dbase_postgresql
