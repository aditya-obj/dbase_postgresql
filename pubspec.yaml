name: dbase_postgresql
description: >-
  Pure-Dart PostgreSQL toolkit: libpq connection string parsing, .pgpass,
  service file and pgAdmin importers, a SQL lexer, a psql-style statement
  splitter, statement safety checks, and an EXPLAIN (FORMAT JSON) analyzer.
version: 0.4.0
publish_to: none
repository: https://github.com/aditya-obj/dbase_postgresql
issue_tracker: https://github.com/aditya-obj/dbase_postgresql/issues
topics:
  - postgresql
  - postgres
  - sql
  - parser
  - database

environment:
  sdk: ^3.13.5

dev_dependencies:
  # Integration tests only (test/integration/, tag `integration`). The
  # library itself has no runtime dependencies.
  # Floor for `dart pub downgrade`: 3.x looks for frontend_server.dart.snapshot,
  # which Dart 3.13 no longer ships (test_core still allows >=3.2.0).
  frontend_server_client: ^4.0.0
  postgres: ^3.5.20
  test: ^1.33.0
  very_good_analysis: ^11.0.0
